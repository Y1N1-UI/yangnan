<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS内部对象</title>
</head>
<body>
    


    <script>
        //Math
        console.log(Math.floor(1.9)); //向下取整
        console.log(Math.round(1.9)); //四舍五入
        //console.log(Math.random()); //随机数 0-1之间的随机数 不包含1
        //随机取0到100的整数
        console.log(Math.floor(Math.random()*100+1));
        //随机数最大最小
        // function randomNum(min,max){
        //     return Math.floor(Math.random()*(max-min+1)+min);
        // }

        //Date对象
        var date = new Date();
        console.log(date.getFullYear()); //获取年份
        console.log(date.getMonth()+1); //获取月份 0-11
        console.log(date.getDate()); //获取日期
        console.log(date.getDay()); //获取星期几 0-6 0表示星期日
        console.log(date.getHours()+':'+date.getMinutes()+':'+date.getSeconds()); //获取小时、分钟和秒
        console.log(date.getTime()); //获取时间戳

        //数组
        var arr = [1,2,3,4,5,6,'seven','eight','nine','ten'];
        var arr1 = new Array(1,2,3,4,5,6,'seven','eight','nine','ten');
        var arr2 = new Array(5); //创建一个长度为5的数组
        //
        console.log(arr2);
        var arr3 = new Array('five'); //创建一个长度为1的数组，元素为'five'

    </script>

</body>
</html>
